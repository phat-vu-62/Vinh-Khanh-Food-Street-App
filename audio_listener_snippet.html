<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nghe thuyết minh - FoodStreet</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #0984e3;
            --accent: #00cec9;
            --bg: #dfe6e9;
            --card: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #2d3436;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: var(--card);
            border-radius: 30px;
            padding: 40px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 10px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .rest-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #2d3436;
        }

        .status {
            font-size: 0.9rem;
            color: #636e72;
            margin-bottom: 30px;
        }

        /* Essential playback trigger */
        #playTrigger {
            background: var(--primary);
            color: white;
            border: none;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 2.5rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(9, 132, 227, 0.3);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        #playTrigger:hover {
            transform: scale(1.1);
            background: #0873c4;
        }

        #playTrigger:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(9, 132, 227, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(9, 132, 227, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(9, 132, 227, 0); }
        }

        .audio-controls {
            margin-top: 30px;
            display: none; /* Shown after interaction */
        }

        .progress-container {
            width: 100%;
            height: 5px;
            background: #eee;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.1s linear;
        }

        .time {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #b2bec3;
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="rest-icon">
            <i class="bi bi-shop"></i>
        </div>
        <h1 id="restaurantName">Chào mừng bạn</h1>
        <p class="status" id="loadStatus">Nhấn để nghe câu chuyện của quán</p>

        <!-- Hidden Audio Element -->
        <audio id="mainAudio">
            <source src="[AUDIO_URL_PLACEHOLDER]" type="audio/mpeg">
        </audio>

        <!-- Play Trigger (Overcomes Autoplay Policy) -->
        <button id="playTrigger">
            <i class="bi bi-play-fill" id="btnIcon"></i>
        </button>

        <div class="audio-controls" id="controls">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('mainAudio');
        const trigger = document.getElementById('playTrigger');
        const status = document.getElementById('loadStatus');
        const controls = document.getElementById('controls');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const btnIcon = document.getElementById('btnIcon');

        // Extract Restaurant ID from URL for dynamic display
        const resId = window.location.pathname.split('/').pop();
        if(resId && !isNaN(resId)) {
            document.getElementById('restaurantName').innerText = "Quán #" + resId;
        }

        let isPlaying = false;

        trigger.addEventListener('click', () => {
            if (!isPlaying) {
                // IMPORTANT: Interaction context allows play()
                audio.play()
                    .then(() => {
                        isPlaying = true;
                        status.innerText = "Đang phát...";
                        controls.style.display = 'block';
                        btnIcon.className = "bi bi-pause-fill";
                        trigger.style.animation = "none";
                    })
                    .catch(err => {
                        console.error("Playback failed:", err);
                        status.innerText = "Không thể phát âm thanh";
                    });
            } else {
                audio.pause();
                isPlaying = false;
                status.innerText = "Đã tạm dừng";
                btnIcon.className = "bi bi-play-fill";
            }
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + '%';
            currentTimeEl.innerText = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.innerText = formatTime(audio.duration);
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
